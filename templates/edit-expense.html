{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<div class="profile-header">
    <div class="profile-header-inner">
        <h1 class="terms-title">Edit Expense</h1>
    </div>
</div>

<div class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            {% if error %}
            <p class="auth-error">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
                <div class="form-group">
                    <label class="form-label" for="amount">Amount (₹)</label>
                    <input class="form-input" type="number" id="amount" name="amount"
                           step="0.01" min="0.01" value="{{ expense.amount }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="category">Category</label>
                    <select class="form-input" id="category" name="category" required>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if cat == expense.category %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="date">Date</label>
                    <input class="form-input" type="date" id="date" name="date"
                           value="{{ expense.date }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Description <span class="form-optional">(optional)</span></label>
                    <input class="form-input" type="text" id="description" name="description"
                           value="{{ expense.description or '' }}" placeholder="e.g. Lunch with team">
                </div>

                <button type="submit" class="btn-submit">Save Changes</button>
            </form>

            <p class="auth-switch"><a href="{{ url_for('profile') }}">← Back to profile</a></p>
        </div>
    </div>
</div>
{% endblock %}
